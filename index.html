<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f7a43" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- SEO -->
    <title>EEJ-C | Eglise des Envoyés de Jésus-Christ</title>
    <meta
      name="description"
      content="Site officiel de l'Eglise des Envoyés de Jésus-Christ. Découvrez nos cultes, nos programmes, la diffusion en direct et nos annexes à Lomé, au Togo."
    />
    <meta
      name="keywords"
      content="église évangélique, culte, louange, apôtre, enseignement biblique, prière, diffusion en direct, annexes, EEJ-C, Lomé, Togo"
    />
    <meta name="author" content="Eglise des Envoyés de Jésus-Christ" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.eej-c.org/" />

    <!-- Open Graph / réseaux sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Eglise des Envoyés de Jésus-Christ" />
    <meta
      property="og:description"
      content="Une famille, une foi, une mission. Cultes, enseignements, diffusion en direct et annexes."
    />
    <meta property="og:image" content="https://images.pexels.com/photos/36425621/pexels-photo-36425621.jpeg?auto=compress&cs=tinysrgb&w=1200&h=630&fit=crop" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon EEJ-C -->
    <link rel="icon" type="image/jpeg" href="/LogoEEJC-web.jpeg" />

    <!-- Polices Google : Playfair Display (titres) + Plus Jakarta Sans (texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Données structurées (SEO local) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "PlaceOfWorship",
        "name": "Eglise des Envoyés de Jésus-Christ",
        "description": "Église des Envoyées de Jésus-Christ : cultes, enseignement biblique, prière et diffusion en direct.",
        "url": "https://www.eej-c.org",
        "telephone": "+228 90 10 72 01",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rue des Lauriers, Gbenyedzi Alaglo",
          "addressLocality": "Lomé",
          "addressCountry": "TG"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 6.145409959384881,   
          "longitude": 1.2580930975711468
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "08:30",
            "closes": "13:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
